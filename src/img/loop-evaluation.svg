<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 210" role="img" aria-labelledby="t"><title id="t">The evaluation loop: run the system, find what's wrong, write a new check, run again.</title><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#ededec}.kick{font-size:10.5px;letter-spacing:.14em;font-weight:700}.title{font-size:15px;font-weight:700}.sub{font-size:11.5px;fill:#8b8b93}.edge{font-size:12px;fill:#8b8b93}.g{fill:#2f9e74}.w{fill:#cfe9dd}.a{fill:#f0c060}.box{fill:#141417}.gb{stroke:#2f9e74;stroke-width:1.5}.wb{stroke:#d7d7da;stroke-width:1.5}.ab{stroke:#f0c060;stroke-width:1.5;stroke-dasharray:6 5}</style><defs><marker id="g" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f9e74"/></marker><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#f0c060"/></marker></defs>
<g><rect x="24" y="46" width="190" height="66" rx="14" class="box gb"/><text class="kick g" x="119" y="76" text-anchor="middle">RUN</text><text class="title" x="119" y="96" text-anchor="middle">Run the system</text></g>
<line x1="214" y1="79" x2="254" y2="79" stroke="#2f9e74" stroke-width="1.5" marker-end="url(#g)"/>
<g><rect x="258" y="46" width="190" height="66" rx="14" class="box gb"/><text class="kick g" x="353" y="76" text-anchor="middle">MEASURE</text><text class="title" x="353" y="96" text-anchor="middle">Find what's wrong</text></g>
<line x1="448" y1="79" x2="488" y2="79" stroke="#2f9e74" stroke-width="1.5" marker-end="url(#g)"/>
<g><rect x="492" y="46" width="190" height="66" rx="14" class="box gb"/><text class="kick g" x="587" y="76" text-anchor="middle">REFINE</text><text class="title" x="587" y="96" text-anchor="middle">Write a new check</text></g>
<path d="M587,112 L587,160 Q587,172 575,172 L131,172 Q119,172 119,160 L119,114" fill="none" stroke="#2f9e74" stroke-width="1.5" marker-end="url(#g)"/>
<rect x="250" y="163" width="206" height="18" fill="#0e0e10"/><text class="edge" x="353" y="176" text-anchor="middle">every pass gets a little better</text></svg>
