<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" role="img" aria-labelledby="t"><title id="t">Reflection: draft, check it, ship on pass, retry on fail, and escalate to a human after a few tries.</title><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#ededec}.kick{font-size:10.5px;letter-spacing:.14em;font-weight:700}.title{font-size:15px;font-weight:700}.sub{font-size:11.5px;fill:#8b8b93}.edge{font-size:12px;fill:#8b8b93}.g{fill:#2f9e74}.w{fill:#cfe9dd}.a{fill:#f0c060}.box{fill:#141417}.gb{stroke:#2f9e74;stroke-width:1.5}.wb{stroke:#d7d7da;stroke-width:1.5}.ab{stroke:#f0c060;stroke-width:1.5;stroke-dasharray:6 5}</style><defs><marker id="g" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f9e74"/></marker><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#f0c060"/></marker></defs>
<g><rect x="24" y="46" width="180" height="66" rx="14" class="box gb"/><text class="kick g" x="114" y="76" text-anchor="middle">DRAFT</text><text class="title" x="114" y="96" text-anchor="middle">Produce output</text></g>
<line x1="204" y1="79" x2="244" y2="79" stroke="#2f9e74" stroke-width="1.5" marker-end="url(#g)"/>
<g><rect x="246" y="46" width="180" height="66" rx="14" class="box gb"/><text class="kick g" x="336" y="76" text-anchor="middle">CHECK</text><text class="title" x="336" y="96" text-anchor="middle">Does it pass?</text></g>
<line x1="426" y1="79" x2="466" y2="79" stroke="#2f9e74" stroke-width="1.5" marker-end="url(#g)"/>
<g><rect x="468" y="46" width="180" height="66" rx="14" class="box gb"/><text class="kick g" x="558" y="76" text-anchor="middle">PASS</text><text class="title" x="558" y="96" text-anchor="middle">Ship it</text></g>
<path d="M336,112 L336,150 Q336,162 324,162 L126,162 Q114,162 114,150 L114,114" fill="none" stroke="#2f9e74" stroke-width="1.5" marker-end="url(#g)"/>
<rect x="168" y="153" width="114" height="18" fill="#0e0e10"/><text class="edge" x="225" y="166" text-anchor="middle">fail, retry</text>
<path d="M336,112 L336,196" fill="none" stroke="#f0c060" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#a)"/>
<text class="edge a" x="346" y="200" style="fill:#f0c060">after a few tries, escalate to a human</text></svg>
