<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t"><title id="t">Loops on loops: each task is routed and reflected on inside an evaluation loop that improves over time, with a human on the outer edge.</title><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#ededec}.kick{font-size:10.5px;letter-spacing:.14em;font-weight:700}.title{font-size:15px;font-weight:700}.sub{font-size:11.5px;fill:#8b8b93}.edge{font-size:12px;fill:#8b8b93}.g{fill:#2f9e74}.w{fill:#cfe9dd}.a{fill:#f0c060}.box{fill:#141417}.gb{stroke:#2f9e74;stroke-width:1.5}.wb{stroke:#d7d7da;stroke-width:1.5}.ab{stroke:#f0c060;stroke-width:1.5;stroke-dasharray:6 5}</style><defs><marker id="g" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f9e74"/></marker><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#f0c060"/></marker></defs>
<rect x="36" y="24" width="648" height="252" rx="18" class="box wb"/><text class="kick w" x="56" y="48">HUMAN · VALIDATES, WRITES RULES</text>
<rect x="104" y="70" width="512" height="176" rx="16" fill="#101014" class="gb"/><text class="kick g" x="124" y="94">EVALUATION LOOP · TEST, LEARN, REFINE</text>
<rect x="188" y="120" width="344" height="92" rx="14" class="box gb"/><text class="kick g" x="360" y="150" text-anchor="middle">EACH TASK</text><text class="title" x="360" y="172" text-anchor="middle">Route &amp; reflect</text><text class="sub" x="360" y="192" text-anchor="middle">runs in the moment</text></svg>
