<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 470" role="img" aria-labelledby="pipe-title">
  <title id="pipe-title">Fact-sheet pipeline. A deterministic, scripted pipeline — ingest assured LCA data and approved claims, fill and localize the numbers, pass a fail-closed QA gate, render into Figma by ID, and export PDFs — with humans owning the judgment calls: providing the data, placing per-locale images, and doing final review and publish. The QA gate re-runs on failure and escalates to a human after three attempts. No autonomous agent.</title>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #ededec; }
    .kick { font-size: 11px; letter-spacing: 0.14em; font-weight: 600; }
    .title { font-size: 17px; font-weight: 700; }
    .sub { font-size: 12.5px; fill: #8b8b93; }
    .legend { font-size: 13px; fill: #8b8b93; }
    .edge { font-size: 11.5px; fill: #8b8b93; }
    .det { fill: #2f9e74; }
    .hum { fill: #cfe9dd; }
    .amb { fill: #f0c060; }
    .box { fill: #141417; }
    .det-box { stroke: #2f9e74; stroke-width: 1.5; }
    .hum-box { stroke: #d7d7da; stroke-width: 1.5; }
    .amb-box { stroke: #f0c060; stroke-width: 1.5; stroke-dasharray: 6 5; }
  </style>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8b8b93"/></marker>
    <marker id="ar-w" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d7d7da"/></marker>
    <marker id="ar-a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#f0c060"/></marker>
  </defs>

  <!-- legend -->
  <rect x="30" y="8" width="15" height="15" rx="4" class="box det-box"/>
  <text class="legend" x="52" y="20">Deterministic (automated)</text>
  <rect x="250" y="8" width="15" height="15" rx="4" class="box hum-box"/>
  <text class="legend" x="272" y="20">Human — judgment &amp; compliance</text>
  <rect x="520" y="8" width="15" height="15" rx="4" class="box amb-box"/>
  <text class="legend" x="542" y="20">Failure / escalation</text>

  <!-- human gates (top) -->
  <g>
    <rect x="30" y="66" width="180" height="66" rx="14" class="box hum-box"/>
    <text class="kick hum" x="120" y="90" text-anchor="middle">HUMAN</text>
    <text class="title" x="120" y="112" text-anchor="middle">Provide data</text>
    <text class="sub" x="120" y="127" text-anchor="middle">LCA + datapoints</text>
  </g>
  <g>
    <rect x="645" y="66" width="180" height="66" rx="14" class="box hum-box"/>
    <text class="kick hum" x="735" y="90" text-anchor="middle">HUMAN</text>
    <text class="title" x="735" y="112" text-anchor="middle">Place images</text>
    <text class="sub" x="735" y="127" text-anchor="middle">per locale</text>
  </g>

  <!-- human connectors down into pipeline -->
  <line x1="120" y1="132" x2="120" y2="248" stroke="#d7d7da" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#ar-w)"/>
  <line x1="735" y1="132" x2="735" y2="248" stroke="#d7d7da" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#ar-w)"/>

  <!-- escalate node (above gate) -->
  <g>
    <rect x="440" y="158" width="180" height="58" rx="14" class="box amb-box"/>
    <text class="title amb" x="530" y="184" text-anchor="middle" style="font-size:15px">3× fail → human</text>
    <text class="sub" x="530" y="203" text-anchor="middle">publish blocked</text>
  </g>
  <line x1="530" y1="216" x2="530" y2="248" stroke="#f0c060" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#ar-a)"/>

  <!-- forward arrows (pipeline, y=306) -->
  <line x1="212" y1="306" x2="233" y2="306" stroke="#8b8b93" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="417" y1="306" x2="438" y2="306" stroke="#8b8b93" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="622" y1="306" x2="643" y2="306" stroke="#8b8b93" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="827" y1="306" x2="848" y2="306" stroke="#8b8b93" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- pipeline nodes (y=250 h=112) -->
  <g>
    <rect x="30" y="250" width="180" height="112" rx="14" class="box det-box"/>
    <text class="kick det" x="120" y="280" text-anchor="middle">INPUTS</text>
    <text class="title" x="120" y="308" text-anchor="middle">Assured LCA data</text>
    <text class="sub" x="120" y="332" text-anchor="middle">+ approved claims</text>
  </g>
  <g>
    <rect x="235" y="250" width="180" height="112" rx="14" class="box det-box"/>
    <text class="kick det" x="325" y="280" text-anchor="middle">COMPUTE · LOCALIZE</text>
    <text class="title" x="325" y="308" text-anchor="middle">Fill &amp; localize</text>
    <text class="sub" x="325" y="332" text-anchor="middle">numbers into wording</text>
  </g>
  <g>
    <rect x="440" y="250" width="180" height="112" rx="14" class="box det-box"/>
    <text class="kick det" x="530" y="280" text-anchor="middle">QA GATE</text>
    <text class="title" x="530" y="308" text-anchor="middle">Checks must pass</text>
    <text class="sub" x="530" y="332" text-anchor="middle">fail-closed</text>
  </g>
  <g>
    <rect x="645" y="250" width="180" height="112" rx="14" class="box det-box"/>
    <text class="kick det" x="735" y="280" text-anchor="middle">RENDER · EXPORT</text>
    <text class="title" x="735" y="308" text-anchor="middle">Figma via MCP</text>
    <text class="sub" x="735" y="332" text-anchor="middle">ID-based · PDFs</text>
  </g>
  <g>
    <rect x="850" y="250" width="180" height="112" rx="14" class="box hum-box"/>
    <text class="kick hum" x="940" y="280" text-anchor="middle">HUMAN</text>
    <text class="title" x="940" y="308" text-anchor="middle">Review &amp; publish</text>
    <text class="sub" x="940" y="332" text-anchor="middle">QA + legal</text>
  </g>

  <!-- failure loop: gate back to compute/localize -->
  <path d="M485,362 L485,412 L325,412 L325,364" fill="none" stroke="#f0c060" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#ar-a)"/>
  <text class="edge amb" x="405" y="428" text-anchor="middle">fail (tries 1–2) — re-run</text>
</svg>
