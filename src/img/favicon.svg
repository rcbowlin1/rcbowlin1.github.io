<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- floppy ear (back of head) -->
  <ellipse cx="47" cy="24" rx="7.5" ry="14" fill="#c98a3c" transform="rotate(14 47 24)"/>
  <!-- head -->
  <circle cx="40" cy="30" r="15" fill="#e7b15c"/>
  <!-- snout extending left -->
  <ellipse cx="19" cy="35" rx="15" ry="9.5" fill="#e7b15c"/>
  <!-- nose at the tip -->
  <ellipse cx="7.5" cy="34.5" rx="3.6" ry="3.1" fill="#2e2116"/>
  <!-- eye -->
  <circle cx="37" cy="27" r="2.7" fill="#2e2116"/>
  <!-- mouth line -->
  <path d="M9 41 q8 3.5 17 1" fill="none" stroke="#b07f34" stroke-width="1.6" stroke-linecap="round"/>
</svg>
