<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 210" role="img" aria-labelledby="t"><title id="t">Human in the loop: the system surfaces exceptions to a person, who writes rules that feed back in, and sees less over time.</title><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#ededec}.kick{font-size:10.5px;letter-spacing:.14em;font-weight:700}.title{font-size:15px;font-weight:700}.sub{font-size:11.5px;fill:#8b8b93}.edge{font-size:12px;fill:#8b8b93}.g{fill:#2f9e74}.w{fill:#cfe9dd}.a{fill:#f0c060}.box{fill:#141417}.gb{stroke:#2f9e74;stroke-width:1.5}.wb{stroke:#d7d7da;stroke-width:1.5}.ab{stroke:#f0c060;stroke-width:1.5;stroke-dasharray:6 5}</style><defs><marker id="g" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f9e74"/></marker><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#f0c060"/></marker></defs>
<g><rect x="60" y="62" width="200" height="72" rx="14" class="box gb"/><text class="kick g" x="160" y="92" text-anchor="middle">SYSTEM</text><text class="title" x="160" y="112" text-anchor="middle">Runs the work</text></g>
<g><rect x="460" y="62" width="200" height="72" rx="14" class="box wb"/><text class="kick w" x="560" y="92" text-anchor="middle">HUMAN</text><text class="title" x="560" y="112" text-anchor="middle">Validates, writes rules</text></g>
<path d="M260,84 L456,84" fill="none" stroke="#d7d7da" stroke-width="1.5" marker-end="url(#g)"/>
<rect x="300" y="68" width="120" height="16" fill="#0e0e10"/><text class="edge" x="360" y="80" text-anchor="middle">exceptions</text>
<path d="M460,112 L264,112" fill="none" stroke="#2f9e74" stroke-width="1.5" marker-end="url(#g)"/>
<rect x="308" y="104" width="104" height="16" fill="#0e0e10"/><text class="edge g" x="360" y="116" text-anchor="middle">new rules</text>
<text class="edge" x="360" y="168" text-anchor="middle">the human sees fewer exceptions every pass</text></svg>
