<!DOCTYPE html>
<!-- Source for the OG/link-preview image. Rendered to src/img/og-card.png via Chrome headless --screenshot at 1200x630. Not published. -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0e0e10; --fg: #ededec; --muted: #9a9aa2;
    --accent: #2f9e74;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  html, body { width: 1200px; height: 630px; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--sans);
    position: relative;
    overflow: hidden;
  }
  /* subtle spruce glow, top-left */
  body::before {
    content: "";
    position: absolute;
    top: -220px; left: -160px;
    width: 620px; height: 620px;
    background: radial-gradient(circle, rgba(47,158,116,0.13) 0%, rgba(47,158,116,0) 68%);
    pointer-events: none;
  }
  .text {
    position: absolute;
    left: 72px;
    top: 50%;
    transform: translateY(-50%);
    max-width: 560px;
    z-index: 2;
  }
  .eyebrow {
    font-family: var(--sans);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    font-size: 22px;
    color: var(--muted);
    margin-bottom: 26px;
  }
  h1 {
    font-size: 92px;
    font-weight: 800;
    line-height: 1.02;
    letter-spacing: -0.02em;
    margin-bottom: 26px;
  }
  .tagline {
    font-size: 38px;
    font-weight: 500;
    line-height: 1.25;
    color: var(--fg);
  }
  .url {
    font-family: var(--sans);
    font-size: 24px;
    color: var(--accent);
    font-weight: 600;
    margin-top: 40px;
  }
  /* cut-out portrait, rising from the bottom-right (no frame, transparent bg) */
  .portrait {
    position: absolute;
    right: -50px;
    bottom: -70px;
    height: 620px;
    width: auto;
    z-index: 1;
  }
  .accent-bar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 10px;
    background: var(--accent);
    z-index: 3;
  }
</style>
</head>
<body>
  <div class="text">
    <div class="eyebrow">Product Manager · Applied AI</div>
    <h1>Ryan Bowlin</h1>
    <div class="tagline">I build and ship production AI.</div>
    <div class="url">rcbowlin1.github.io</div>
  </div>
  <img class="portrait" src="src/img/ryan-bowlin-cutout.png" alt="Ryan Bowlin" />
  <div class="accent-bar"></div>
</body>
</html>
